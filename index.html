<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>极简待办</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--sub:#999;--line:#f0f0f0;--accent:#1a1a1a;--in:#fafafa;--inb:#e8e8e8}
body.dark{--bg:#0f1115;--card:#181b21;--text:#e8eaed;--sub:#8a8f98;--line:#262a31;--accent:#e8eaed;--in:#1f232a;--inb:#2a2f37}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:0;overflow:hidden}
.app{width:100%;max-width:440px;background:var(--card);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
@media(min-width:480px){body{padding:10px;align-items:center}.app{height:96vh;max-height:96vh;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.1)}}
.hd{padding:8px 12px 0;flex-shrink:0}
.ht{display:flex;align-items:center;gap:5px;margin-bottom:6px}
h1{font-size:15px;font-weight:700;flex-shrink:0;letter-spacing:-.3px}
.wc{flex:1;text-align:center;font-size:10px;font-weight:600;padding:4px 6px;background:var(--in);border-radius:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--sub)}
.badge{font-size:9px;font-weight:600;padding:4px 7px;background:var(--in);border-radius:14px;white-space:nowrap;flex-shrink:0;color:var(--sub);display:none;cursor:default}
.badge.show{display:inline-block}
.badge.ok{color:#2e7d32}
.badge.err{color:#c62828}
.badge.busy{color:#f57c00}
.acts{display:flex;gap:3px;flex-shrink:0}
.b{border:none;background:var(--in);color:var(--text);font-size:13px;cursor:pointer;padding:5px 7px;border-radius:8px;font-family:inherit;line-height:1}
.b:hover{background:var(--inb)}
.b.on{background:var(--accent);color:#fff}
body.dark .b.on{color:#0f1115}
.mo{font-size:11px;color:var(--sub);font-style:italic;text-align:center;padding:5px 10px;margin-bottom:6px;background:var(--in);border-radius:8px;transition:opacity .5s}
.mo.hide{display:none}
.sw{display:none;margin-bottom:6px}
.sw.on{display:block}
.sw input{width:100%;padding:8px 12px;border:1.5px solid var(--inb);border-radius:10px;font-size:13px;outline:none;background:var(--in);color:var(--text);font-family:inherit}
.fr{display:none;gap:6px;margin-bottom:6px}
.fr.on{display:flex}
.fbt{padding:5px 10px;background:var(--in);color:var(--sub);border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.fbt.on{background:#fff8e1;color:#e65100}
.fbt.on::before{content:'★ '}
.fbt:not(.on)::before{content:'☆ '}
.tabs{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:var(--in);color:var(--sub);font-family:inherit;white-space:nowrap;flex-shrink:0}
.tab.on{background:var(--accent);color:#fff}
body.dark .tab.on{color:#0f1115}
.area{flex:1;overflow-y:auto;padding:0 12px 8px;display:none;-webkit-overflow-scrolling:touch}
.area.on{display:block}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:13px;text-align:center;padding:0 20px}
.item{padding:9px 10px;border-radius:10px;cursor:pointer;user-select:none;margin-bottom:4px;display:flex;align-items:flex-start;gap:8px;border-left:3px solid transparent;touch-action:pan-y;will-change:transform;background:var(--card)}
.item:hover{background:var(--in)}
.item.imp{background:#fffbf0;border-left-color:#f9a825}
body.dark .item.imp{background:#2a2318}
.item.dn .txt{opacity:.5;text-decoration:line-through}
.item.od .txt{color:#c62828}
.item.sr{background:#e8f5e9!important;border-left-color:#4caf50}
.item.sl{background:#ffebee!important;border-left-color:#e53935}
body.dark .item.sr{background:#1a2c1f!important}
body.dark .item.sl{background:#331b1b!important}
.star{width:20px;height:20px;flex-shrink:0;border:none;background:transparent;font-size:15px;padding:0;cursor:pointer;color:#ccc;margin-top:1px;line-height:1}
.star.on{color:#f9a825}
.bd{flex:1;min-width:0}
.txt{font-size:14px;font-weight:500;line-height:1.35;word-break:break-word;margin-bottom:3px}
.item.imp .txt{font-weight:600}
.sb2{font-size:11px;color:var(--sub);line-height:1.35}
.sb2 .tag{display:inline-block;background:#eef2ff;color:#4c51bf;font-size:10px;padding:0 5px;border-radius:4px;margin-right:3px;font-weight:600}
.sb2 .du{display:inline-block;background:#fff3e0;color:#e65100;font-size:10px;padding:0 5px;border-radius:4px;margin-right:3px;font-weight:600}
.sb2 .du.od{background:#ffebee;color:#c62828}
.sb2 .rp{display:inline-block;background:#e8f5e9;color:#2e7d32;font-size:10px;padding:0 5px;border-radius:4px;margin-right:3px;font-weight:600}
.tc{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
.calh{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.cn{width:30px;height:30px;border-radius:8px;border:none;background:var(--in);color:var(--text);font-size:16px;cursor:pointer;font-family:inherit}
.ct{font-size:13px;font-weight:600;text-align:center}
.ct small{display:block;font-size:10px;color:var(--sub);font-weight:500;margin-top:1px}
.cw{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--sub);padding-bottom:4px;font-weight:500}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cc{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:12px}
.cc:hover{background:var(--in)}
.cc.td{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cc.sel{background:var(--accent);color:#fff}
.cc.hd{font-weight:700}
.cn2{position:absolute;top:1px;right:1px;background:var(--accent);color:#fff;font-size:8px;font-weight:700;padding:0 4px;border-radius:6px;min-width:13px;text-align:center;line-height:11px}
.dh{font-size:13px;font-weight:600;margin:12px 0 8px;display:flex;align-items:baseline;gap:5px}
.cp{font-size:10px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;font-weight:600}
.dit{padding:8px 10px;border-radius:8px;background:var(--in);margin-bottom:5px}
.dit.imp{background:#fffbf0}
.dc{font-size:13px;font-weight:500}
.tll{position:relative;padding-left:20px}
.tll::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;margin-bottom:11px}
.td2{position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--accent)}
.td2.dn{background:#2e7d32;border-color:#2e7d32}
.tt2{font-size:10px;color:var(--sub);font-weight:600;margin-bottom:2px}
.tc2{font-size:13px;font-weight:500;word-break:break-word}
.th{font-size:12px;font-weight:700;margin:12px 0 6px -20px}
.rt{display:flex;gap:5px;margin-bottom:10px}
.rt button{flex:1;padding:6px 4px;border-radius:8px;border:none;background:var(--in);color:var(--sub);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.rt button.on{background:var(--accent);color:#fff}
.og{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.sc{background:var(--in);border-radius:10px;padding:9px;border-left:3px solid var(--accent)}
.sc.or{border-left-color:#f9a825;background:#fffbf0}
.sc.gr{border-left-color:#2e7d32;background:#f1f8e9}
.sc.bl{border-left-color:#1565c0;background:#e3f2fd}
.slbl{font-size:10px;color:var(--sub);font-weight:600;margin-bottom:2px}
.sv{font-size:18px;font-weight:700}
.sv small{font-size:11px;color:var(--sub);margin-left:2px}
.ss{font-size:10px;color:var(--sub);margin-top:2px}
.ch{background:var(--in);border-radius:12px;padding:11px;margin-bottom:9px}
.ctit{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ctit .cs{font-size:10px;font-weight:500;color:var(--sub)}
canvas{display:block;width:100%;height:110px}
.add{border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));flex-shrink:0}
.ab{display:flex;gap:5px;align-items:center}
.ab input[type=text]{flex:1;padding:9px 12px;border:1.5px solid var(--inb);border-radius:10px;font-size:14px;outline:none;background:var(--in);color:var(--text);font-family:inherit;min-width:0}
.ab input:focus{border-color:var(--accent);background:var(--card)}
.ab .b{width:34px;height:34px;font-size:15px;padding:0;flex-shrink:0;border-radius:10px}
.ab .b.sa.on{background:#fff8e1;color:#f9a825}
.ab .mic{width:auto;padding:0 10px;font-size:12px;background:#fff;color:#1a1a1a;border:1.5px solid var(--inb);border-radius:10px}
.ab .mic.rec{background:#ffebee;color:#e53935}
.ab .addb{height:34px;padding:0 12px;background:#fff;color:#1a1a1a;border:1.5px solid var(--inb);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;gap:3px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:2000;max-width:90%;text-align:center}
body.dark .toast{color:#0f1115}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ut{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:8px 10px 8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:2001;display:flex;align-items:center;gap:10px}
body.dark .ut{color:#0f1115}
.ut.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ut button{background:#fff;color:var(--accent);border:none;border-radius:12px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
body.dark .ut button{background:#0f1115;color:#e8eaed}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.ov.on{display:flex}
.dlg{background:var(--card);border-radius:14px;padding:18px;max-width:360px;width:100%;max-height:86vh;overflow-y:auto;color:var(--text)}
.dlg h2{font-size:16px;font-weight:700;margin-bottom:5px}
.dlg .s2{font-size:11px;color:var(--sub);margin-bottom:12px;line-height:1.5}
.dlg label.f{display:block;font-size:11px;font-weight:600;color:var(--sub);margin:10px 0 5px}
.dlg input[type=text],.dlg input[type=password]{width:100%;padding:9px 11px;border:1.5px solid var(--inb);border-radius:9px;font-size:13px;outline:none;background:var(--in);color:var(--text);font-family:inherit}
.dlg input:focus{border-color:var(--accent)}
.dr{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dr button{flex:1;min-width:80px;padding:9px 10px;border-radius:9px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--in);color:var(--text)}
.dr button.pri{background:var(--accent);color:#fff}
body.dark .dr button.pri{color:#0f1115}
.dm{margin-top:10px;font-size:11px;color:var(--sub);padding:8px 10px;background:var(--in);border-radius:8px}
.tch{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tch .tc3{padding:4px 9px;background:var(--in);border:1.5px solid var(--inb);border-radius:14px;font-size:11px;font-weight:600;cursor:pointer}
.tch .tc3.on{background:#eef2ff;color:#4c51bf;border-color:#c7d2fe}
.sw2{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;cursor:pointer}
.sw2 input{width:16px;height:16px}
.pl{position:fixed;inset:0;pointer-events:none;z-index:3000}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;animation:pf .9s ease-out forwards}
@keyframes pf{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
</style>
</head>
<body>
<div class="app">
<div class="hd">
<div class="ht">

</div>

<script>
(function(){
'use strict';
function $(i){return document.getElementById(i)}
function p2(n){return String(n).padStart(2,'0')}
function td(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dts(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function db(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function pt(t){var m=t.match(/#[^\s#]+/g);return m?m.map(function(x){return x.slice(1)}):[]}
function st(t){return t.replace(/#[^\s#]+/g,'').replace(/\s+/g,' ').trim()}
function ld(k,d){try{var r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var K='minitodo_data',KT='minitodo_trash',KS='minitodo_sync',KLS='minitodo_lastsync',KU='minitodo_ui',KXP='minitodo_xp',KW='minitodo_weather';
var DM=['今天也要加油哦 ✨','一步一步慢慢来 👣','完成比完美更重要 💪','你已经比昨天更好了 🌱','把每件小事做好 🎯','专注当下 🧘'];

var todos=ld(K,[]);
var trash=ld(KT,[]);
var xp=ld(KXP,{total:0});
var ui=Object.assign({starFilter:false,searchOn:false,range:'week',sound:true,particle:true,dark:false,city:''},ld(KU,{}));ui.searchOn=false;
var syncCfg=Object.assign({apiKey:'',binId:'',autoSync:true,enabled:false},ld(KS,{}));
var lastSync=Number(localStorage.getItem(KLS)||0);
var view='pending',nextId=1;
todos.forEach(function(t){if(t.id>=nextId)nextId=t.id+1});
var searchQ='',lastDel=null,undoT=null,addImp=false,recording=false,recog=null;
var calY=new Date().getFullYear(),calM=new Date().getMonth(),selDate=td();
var tagEditId=null,lastSwipeT=0;

function sUI(){var u=Object.assign({},ui,{searchOn:false});sv(KU,u)}
function sTD(){sv(K,todos)}
function sTR(){sv(KT,trash)}

var ac=null;
function au(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}

D.length,repArr:repArr}}
